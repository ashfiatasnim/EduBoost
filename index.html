<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySprint AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>📚 StudySprint AI</h1>

<p>Your Personal AI Academic Coach</p>

<input type="text" id="cgpa" placeholder="Current CGPA">

<input type="text" id="target" placeholder="Target CGPA">

<input type="number" id="days" placeholder="Days Until Exam">

<input type="number" id="hours" placeholder="Study Hours Per Day">

<textarea id="notes" placeholder="Paste your lecture notes here"></textarea>

<button onclick="generatePlan()">Create My Study Plan</button>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
